<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#09090b"
      media="(prefers-color-scheme: dark)"
    />
    <link href="/src/styles.css" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- A crawler reads these without running the page, so they are
         written here and not in LaunchPage's head. The URLs are
         absolute because Open Graph takes no others. -->
    <meta
      name="description"
      content="Effect UI is a frontend library for Effect: build web, terminal and native apps with Elm Architecture components and DevTools for humans and agents."
    />
    <link rel="canonical" href="https://ui.effect.website/" />
    <link
      rel="alternate"
      type="text/markdown"
      href="https://ui.effect.website/article.md"
      title="Introducing Effect UI, as Markdown"
    />

    <meta property="og:type" content="article" />
    <meta property="article:published_time" content="2026-11-26" />
    <meta property="article:modified_time" content="2026-11-27" />
    <meta property="og:site_name" content="Effect UI" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://ui.effect.website/" />
    <meta property="og:title" content="Introducing Effect UI" />
    <meta
      property="og:description"
      content="Effect UI is a frontend library for Effect: build web, terminal and native apps with Elm Architecture components and DevTools for humans and agents."
    />
    <!-- Drawn from og.html. -->
    <meta property="og:image" content="https://ui.effect.website/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Introducing Effect UI. Web, terminal and native apps on Effect: self-contained components and DevTools for humans and agents."
    />

    <!-- X takes the title, description and image from the Open Graph
         tags above. -->
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
