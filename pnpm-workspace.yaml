packages:
  - ai-docs
  - examples/*
  - packages/*
  - packages/tools/*

verifyDepsBeforeRun: error
enableGlobalVirtualStore: false
# pnpm 11 aborts a tarball download that has not finished within fetchTimeout (default 60s),
# however fast it is still progressing.
fetchTimeout: 180000

allowBuilds:
  core-js: false
  dprint: false
  esbuild: false

patchedDependencies:
  '@changesets/cli@3.0.3': patches/@changesets__cli@3.0.3.patch
  '@changesets/get-github-info@1.0.1': patches/@changesets__get-github-info@1.0.1.patch
