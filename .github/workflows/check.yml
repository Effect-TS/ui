name: Check
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  types-matrix:
    name: Types (${{ matrix.name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Check
            command: pnpm check-tsc
          - name: Tests
            command: pnpm test-types --target '>=5.9'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install dependencies
        uses: ./.github/actions/setup
      - run: ${{ matrix.command }}
        env:
          TSTYCHE_FETCH_TIMEOUT: "120"

  types:
    name: Types
    needs: types-matrix
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Check type jobs
        if: needs.types-matrix.result != 'success'
        run: |
          echo "Type checks finished with result: ${{ needs.types-matrix.result }}"
          exit 1

  test:
    name: Test (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: Node
            node: ""
            command: pnpm test --max-concurrency=10
          - runtime: Node 22.19.0 minimum
            node: 22.19.0
            command: pnpm vitest run --project @effect/ui --max-concurrency=10
          - runtime: Node, flush first
            node: ""
            command: pnpm vitest run --max-concurrency=10
            flush: first
          - runtime: Node, flush last
            node: ""
            command: pnpm vitest run --max-concurrency=10
            flush: last
          - runtime: Node, flush seed 1
            node: ""
            command: pnpm vitest run --max-concurrency=10
            flush: 1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install dependencies
        uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}
      - name: Test
        run: ${{ matrix.command }}
        env:
          EFFECT_UI_TEST_FLUSH: ${{ matrix.flush }}

  doctest:
    name: Test (Documentation)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install dependencies
        uses: ./.github/actions/setup
      - name: Test Documentation
        run: pnpm doctest
