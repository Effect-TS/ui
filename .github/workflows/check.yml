name: Check
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  static-checks:
    name: Static
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install dependencies
        uses: ./.github/actions/setup
      - name: Lint
        run: pnpm lint
      - name: Check JSDoc
        run: pnpm jsdocs --check
      - name: Check circular dependencies
        run: pnpm circular
      - name: Check generated barrels
        run: pnpm codegen
      - name: Generate AI documentation
        run: pnpm ai-docgen
      - name: Verify generated files are up-to-date
        run: |
          if [ -n "$(git status --short)" ]; then
            git status --short
            echo "Run 'pnpm codegen' and 'pnpm ai-docgen' and commit generated changes."
            exit 1
          fi

  types-matrix:
    name: Types (${{ matrix.name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # CI type checks with the official compiler; `pnpm check` runs tsrs locally.
          - name: Check
            command: pnpm check-tsc
          - name: Tests
            command: pnpm test-types --target '>=5.9'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install dependencies
        uses: ./.github/actions/setup
      - run: ${{ matrix.command }}
        env:
          TSTYCHE_FETCH_TIMEOUT: "120"

  # Keeps the required `Types` status check covering every job above.
  types:
    name: Types
    needs: types-matrix
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Check type jobs
        if: needs.types-matrix.result != 'success'
        run: |
          echo "Type checks finished with result: ${{ needs.types-matrix.result }}"
          exit 1

  build:
    name: Build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install dependencies
        uses: ./.github/actions/setup
      - name: Set strip internals config
        run: |
          sed -i 's/"stripInternal": false/"stripInternal": true/' tsconfig.base.json
      - run: pnpm build
      - run: pnpm check-dist-types

  bundle-size:
    name: Bundle size
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # On a pull request HEAD is the merge commit and HEAD^1 is the base it merges into.
          fetch-depth: 2
      - name: Install dependencies
        uses: ./.github/actions/setup
      - run: pnpm build
      - name: Measure PR base
        if: github.event_name == 'pull_request'
        # A base that cannot be measured leaves no file, and the report shows absolute sizes only.
        continue-on-error: true
        run: |
          git worktree add --detach "$RUNNER_TEMP/bundle-base" HEAD^1
          cd "$RUNNER_TEMP/bundle-base"
          pnpm install
          pnpm build
          env -u GITHUB_STEP_SUMMARY pnpm bundle-size --json "$RUNNER_TEMP/base-size.json"
      - name: Report bundle size
        run: |
          base="$RUNNER_TEMP/base-size.json"
          if [[ -f "$base" ]]; then
            pnpm bundle-size --base "$base"
          else
            pnpm bundle-size
          fi

  test:
    name: Test (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: Node
            node: ""
            command: pnpm test --max-concurrency=10
          - runtime: Node 22.19.0 minimum
            node: 22.19.0
            command: pnpm vitest run --project @effect/ui --max-concurrency=10
          # The same tests with the render flush before, after and at seeded places among the
          # scheduler's tasks: `TestHost.Flush`.
          - runtime: Node, flush first
            node: ""
            command: pnpm vitest run --max-concurrency=10
            flush: first
          - runtime: Node, flush last
            node: ""
            command: pnpm vitest run --max-concurrency=10
            flush: last
          - runtime: Node, flush seed 1
            node: ""
            command: pnpm vitest run --max-concurrency=10
            flush: 1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install dependencies
        uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}
      - name: Test
        run: ${{ matrix.command }}
        env:
          EFFECT_UI_TEST_FLUSH: ${{ matrix.flush }}

  doctest:
    name: Test (Documentation)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install dependencies
        uses: ./.github/actions/setup
      - name: Test Documentation
        run: pnpm doctest
