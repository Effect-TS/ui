name: Check
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  static-checks:
    name: Static
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install dependencies
        uses: ./.github/actions/setup
      - name: Lint
        run: pnpm lint
      - name: Check JSDoc
        run: pnpm jsdocs --check
      - name: Check circular dependencies
        run: pnpm circular
      - name: Check generated barrels
        run: pnpm codegen
      - name: Generate AI documentation
        run: pnpm ai-docgen
      - name: Verify generated files are up-to-date
        run: |
          if [ -n "$(git status --short)" ]; then
            git status --short
            echo "Run 'pnpm codegen' and 'pnpm ai-docgen' and commit generated changes."
            exit 1
          fi

  types-matrix:
    name: Types (${{ matrix.name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # CI type checks with the official compiler; `pnpm check` runs tsrs locally.
          - name: Check
            command: pnpm check-tsc
          - name: Tests
            command: pnpm test-types --target '>=5.9'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install dependencies
        uses: ./.github/actions/setup
      - run: ${{ matrix.command }}
        env:
          TSTYCHE_FETCH_TIMEOUT: "120"

  # Keeps the required `Types` status check covering every job above.
  types:
    name: Types
    needs: types-matrix
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Check type jobs
        if: needs.types-matrix.result != 'success'
        run: |
          echo "Type checks finished with result: ${{ needs.types-matrix.result }}"
          exit 1

  build:
    name: Build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install dependencies
        uses: ./.github/actions/setup
      - name: Set strip internals config
        run: |
          sed -i 's/"stripInternal": false/"stripInternal": true/' tsconfig.base.json
      - run: pnpm build
      - run: pnpm check-dist-types

  test:
    name: Test (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: Node
            node: ""
            command: pnpm test --max-concurrency=10
          - runtime: Node 22.19.0 minimum
            node: 22.19.0
            command: pnpm vitest run --project @effect/ui --max-concurrency=10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install dependencies
        uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}
      - name: Test
        run: ${{ matrix.command }}

  doctest:
    name: Test (Documentation)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install dependencies
        uses: ./.github/actions/setup
      - name: Test Documentation
        run: pnpm doctest
