name: Launch site
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - examples/launch/**
      - packages/**
      - pnpm-lock.yaml
      - .github/workflows/launch.yml

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  deploy:
    name: Deploy to ui.effect.website
    if: github.repository == 'Effect-TS/ui'
    runs-on: namespace-profile-linux-small
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install dependencies
        uses: ./.github/actions/setup
      - run: pnpm --filter launch build
      - run: pnpm dlx wrangler@4.168.0 deploy
        working-directory: examples/launch
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
